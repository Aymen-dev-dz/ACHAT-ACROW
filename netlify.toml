# Configuration de Déploiement Netlify
# ACROW DZ — Procurement Scraper (by Aymen)

[build]
  publish = "public"
  command = "python3 build_static.py || python build_static.py"

[build.environment]
  PYTHON_VERSION = "3.10"

# Redirection Proxy vers le backend Render & SPA Fallback
# Chaque appel /api/* depuis l'interface Netlify est directement relayé vers le backend Render
[[redirects]]
  from = "/api/*"
  to = "https://achat-acrow.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
