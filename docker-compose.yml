version: '3.8'

services:
  scraper-platform:
    build: .
    container_name: acrow_procurement_scraper
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    volumes:
      - ./resultats:/app/resultats
      - ./screenshots:/app/screenshots
      - ./videos:/app/videos
